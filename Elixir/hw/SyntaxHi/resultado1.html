<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>C++ Code Display</title>
  <style>
    body { background-color: #1e1e1e; color: #d4d4d4; font-family: monospace; padding: 20px; line-height: 1.5; }
    pre { margin: 0; }
    .keyword { color: #569cd6; font-weight: bold; }
    .preprocessor { color: #bd63c5; }
    .comment { color: #6a9955; font-style: italic; }
    .string { color: #ce9178; }
    .number { color: #b5cea8; }
    .operator { color: #b4b4b4; }
    .identifier { color: #9cdcfe; }
    .delimiter { color: #ffd700; }
    .error { color: #ff0000; background-color: #3e1e1e; }
  </style>
</head>
<body>
  <pre><span class="preprocessor">#include</span> <span class="operator"><</span><span class="identifier">iostream</span><span class="operator">></span>

<span class="comment">// This is a simple math function to find factorials</span>
<span class="keyword">int</span> <span class="identifier">calculateFactorial</span><span class="error">(</span><span class="keyword">int</span> <span class="identifier">n</span><span class="error">)</span> <span class="delimiter"></span><span class="delimiter">{</span>
    <span class="keyword">if</span> <span class="delimiter"></span><span class="error">(</span><span class="identifier">n</span> <span class="operator">==</span> <span class="number">0</span><span class="error">)</span> <span class="delimiter"></span><span class="delimiter">{</span>
        <span class="keyword">return</span> <span class="number">1</span><span class="delimiter">;</span>
    <span class="delimiter"></span><span class="error">}</span> <span class="keyword">else</span> <span class="delimiter"></span><span class="delimiter">{</span>
        <span class="keyword">return</span> <span class="identifier">n</span> <span class="operator">*</span> <span class="identifier">calculateFactorial</span><span class="error">(</span><span class="identifier">n</span> <span class="operator">-</span> <span class="number">1</span><span class="error">)</span><span class="delimiter">;</span>
    <span class="delimiter"></span><span class="delimiter">}</span>
<span class="delimiter"></span><span class="delimiter">}</span>

<span class="keyword">int</span> <span class="keyword">main</span><span class="error">(</span><span class="error">)</span> <span class="delimiter"></span><span class="delimiter">{</span>
    <span class="keyword">int</span> <span class="identifier">result</span> <span class="operator">=</span> <span class="identifier">calculateFactorial</span><span class="error">(</span><span class="number">5</span><span class="error">)</span><span class="delimiter">;</span>
    <span class="keyword">std</span><span class="operator">::</span><span class="keyword">cout</span> <span class="operator"><<</span> <span class="string">"The answer is: </span></pre>
</body>
</html>
